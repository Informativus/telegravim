name: Windows release package

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit or ref (empty uses the workflow ref)
        type: string
        required: false
      tests_only:
        description: Build and run native tests without packaging the application
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    environment: network-review
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
          path: TBuild/tdesktop
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Initialize pinned Desktop dependencies
        shell: bash
        working-directory: TBuild/tdesktop
        run: |
          python - <<'PY'
          import subprocess

          rows = subprocess.check_output(["git", "ls-tree", "-r", "HEAD"], text=True)
          paths = [row.split("\t", 1)[1] for row in rows.splitlines()
                   if row.startswith("160000 ") and not row.split("\t", 1)[1].startswith("android/")]
          if not paths:
              raise SystemExit("Desktop dependencies are missing.")
          subprocess.run(["git", "-c", "protocol.file.allow=never", "submodule", "update",
                          "--init", "--recursive", "--depth", "1", "--jobs", "2", "--", *paths], check=True)
          PY
      - name: Validate package metadata
        working-directory: TBuild/tdesktop
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'package-preflight'
          New-Item -ItemType Directory -Path $destination | Out-Null
          python Telegram/build/package_info.py $destination windows-x64
          if ($LASTEXITCODE -ne 0) { throw 'Package metadata preflight failed' }
      - name: Initialize x64 compiler
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          vsversion: 2022
          sdk: 10.0.26100.0
          toolset: 14.44
      - name: Configure dependency build tools
        run: |
          git config --global user.email "build@example.invalid"
          git config --global user.name "Release build"
          $sources = nuget sources List
          if (-not ($sources -match 'https://api.nuget.org/v3/index.json')) {
            nuget sources Add -Name nuget.org -Source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { throw 'NuGet configuration failed' }
          }
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        id: dependencies
        with:
          path: |
            TBuild/Libraries/**
            !TBuild/Libraries/**/
            !TBuild/Libraries/win64/Qt-*/**
            !TBuild/Libraries/**/*.obj
            !TBuild/Libraries/**/*.pch
            !TBuild/Libraries/**/.git/**
          key: windows-x64-libraries-v4-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py') }}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        id: qt
        with:
          path: TBuild/Libraries/win64/Qt-*
          key: windows-x64-qt-v2-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py') }}
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        id: tools
        with:
          path: TBuild/ThirdParty
          key: windows-x64-tools-v2-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py') }}
      - name: Build dependencies
        run: |
          & TBuild\tdesktop\Telegram\build\prepare\win.bat silent qt6
          if ($LASTEXITCODE -ne 0) { throw 'Dependency build failed' }
      - name: Save prepared dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            TBuild/Libraries/**
            !TBuild/Libraries/**/
            !TBuild/Libraries/win64/Qt-*/**
            !TBuild/Libraries/**/*.obj
            !TBuild/Libraries/**/*.pch
            !TBuild/Libraries/**/.git/**
          key: windows-x64-libraries-v4-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py') }}
      - name: Save prepared Qt
        if: steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: TBuild/Libraries/win64/Qt-*
          key: windows-x64-qt-v2-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py') }}
      - name: Save prepared tools
        if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: TBuild/ThirdParty
          key: windows-x64-tools-v2-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/**', 'TBuild/tdesktop/Telegram/build/qt_version.py') }}
      - name: Build Release and native tests
        env:
          BUILD_TARGET: ${{ inputs.tests_only && 'test_vim_keymap' || 'Telegram' }}
          TELEVIM_API_ID: ${{ secrets.TELEVIM_API_ID }}
          TELEVIM_API_HASH: ${{ secrets.TELEVIM_API_HASH }}
        run: |
          @'
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import tempfile

          api_id = os.environ["TELEVIM_API_ID"]
          api_hash = os.environ["TELEVIM_API_HASH"]
          if not re.fullmatch(r"[1-9][0-9]{0,8}", api_id) or not re.fullmatch(r"[a-fA-F0-9]{32}", api_hash):
              raise SystemExit("Private Televim application credentials are missing or invalid.")
          source = pathlib.Path("TBuild/tdesktop").resolve()
          environment = dict(os.environ)
          environment.pop("TELEVIM_API_ID", None)
          environment.pop("TELEVIM_API_HASH", None)
          with tempfile.TemporaryDirectory(prefix="televim-api-", dir=os.environ["RUNNER_TEMP"]) as private:
              config = pathlib.Path(private) / "api.cmake"
              config.write_text('set(TDESKTOP_API_ID "' + api_id + '" CACHE STRING "")\n'
                                'set(TDESKTOP_API_HASH "' + api_hash + '" CACHE STRING "")\n')
              config.chmod(0o600)
              subprocess.run([sys.executable, "configure.py", "-G", "Ninja Multi-Config", "qt6",
                              "-C", str(config), "-DCMAKE_CONFIGURATION_TYPES=Release",
                              "-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=", "-DTDESKTOP_API_TEST=OFF",
                              "-DDESKTOP_APP_TEST_APPS=ON", "-DDESKTOP_APP_DISABLE_AUTOUPDATE=ON",
                              "-DDESKTOP_APP_DISABLE_CRASH_REPORTS=ON"],
                             cwd=source / "Telegram", env=environment, check=True)
              subprocess.run(["cmake", "--build", str(source / "out"), "--config", "Release",
                              "--target", os.environ["BUILD_TARGET"], "--parallel", "3"],
                             env=environment, check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed' }
      - name: Run native tests
        shell: pwsh
        working-directory: TBuild/tdesktop
        run: |
          & out/Release/test_vim_keymap.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
      - name: Package application
        if: ${{ !inputs.tests_only }}
        working-directory: TBuild/tdesktop
        run: |
          New-Item -ItemType Directory -Path artifact/Telegravim | Out-Null
          Copy-Item out/Release/Telegram.exe artifact/Telegravim/
          Copy-Item LICENSE,Telegram/Resources/dictionaries/LICENSE_*.txt artifact/Telegravim/
          python Telegram/build/package_info.py artifact/Telegravim windows-x64
          if ($LASTEXITCODE -ne 0) { throw 'Package metadata failed' }
          dumpbin /headers artifact/Telegravim/Telegram.exe | Select-String 'machine \(x64\)'
          Compress-Archive -Path artifact/Telegravim -DestinationPath artifact/Telegravim-windows-x64.zip
          $hash = (Get-FileHash artifact/Telegravim-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Telegravim-windows-x64.zip" | Set-Content artifact/SHA256-windows-x64.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !inputs.tests_only }}
        with:
          name: Telegravim-windows-x64
          path: |
            TBuild/tdesktop/artifact/Telegravim-windows-x64.zip
            TBuild/tdesktop/artifact/SHA256-windows-x64.txt
          retention-days: 14
          if-no-files-found: error
