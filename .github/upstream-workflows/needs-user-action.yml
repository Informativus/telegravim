name: Needs user action.

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 2 * * *'

jobs:
  needs-user-action:
    runs-on: ubuntu-slim
    steps:
      - uses: lee-dohm/no-response@9bb0a4b5e6a45046f00353d5de7d90fb8bd773bb # v0.5.0
        with:
          token: ${{ github.token }}
          responseRequiredLabel: needs user action
